<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Josh's Journey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <section class="scene">
      <div id="background" class="background"></div>
      <img id="sceneImage" class="scene-image" alt="">
      <div class="shade"></div>

      <header class="topbar">
        <span id="counter">1 / 20</span>
        <span id="location">Dorking</span>
      </header>

      <article class="panel">
        <p class="kicker">JOSH'S JOURNEY</p>
        <h1 id="title"></h1>
        <p id="text"></p>

        <div id="choices" class="choices"></div>
        <button id="backButton" class="back" type="button">Back</button>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
